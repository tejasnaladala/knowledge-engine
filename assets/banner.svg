<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1115;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1D24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" rx="16" />

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50"/><line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/><line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/><line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>

  <!-- Ambient glow -->
  <circle cx="200" cy="200" r="250" fill="url(#glow)">
    <animate attributeName="r" values="250;280;250" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Knowledge graph nodes - left side -->
  <g transform="translate(80, 100)">
    <!-- Central node -->
    <circle cx="120" cy="100" r="18" fill="url(#teal)">
      <animate attributeName="r" values="18;20;18" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Satellite nodes -->
    <circle cx="30" cy="40" r="10" fill="#0D9488" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="30" r="8" fill="#14B8A6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="220" cy="140" r="11" fill="#0D9488" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="20" cy="170" r="7" fill="#14B8A6" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="190" r="9" fill="#0D9488" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="60" cy="200" r="5" fill="#14B8A6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="80" r="6" fill="#0D9488" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Connections -->
    <g stroke="#0D9488" stroke-width="1.5">
      <line x1="120" y1="100" x2="30" y2="40" opacity="0.25">
        <animate attributeName="opacity" values="0.25;0.5;0.25" dur="2.5s" repeatCount="indefinite" />
      </line>
      <line x1="120" y1="100" x2="200" y2="30" opacity="0.25">
        <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3.2s" repeatCount="indefinite" />
      </line>
      <line x1="120" y1="100" x2="220" y2="140" opacity="0.25">
        <animate attributeName="opacity" values="0.25;0.5;0.25" dur="2.8s" repeatCount="indefinite" />
      </line>
      <line x1="120" y1="100" x2="20" y2="170" opacity="0.25">
        <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3.5s" repeatCount="indefinite" />
      </line>
      <line x1="120" y1="100" x2="150" y2="190" opacity="0.25">
        <animate attributeName="opacity" values="0.25;0.5;0.25" dur="2.2s" repeatCount="indefinite" />
      </line>
      <line x1="120" y1="100" x2="250" y2="80" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Cross connections -->
    <g stroke="#14B8A6" stroke-width="0.8" opacity="0.12">
      <line x1="30" y1="40" x2="200" y2="30" />
      <line x1="220" y1="140" x2="150" y2="190" />
      <line x1="20" y1="170" x2="60" y2="200" />
      <line x1="200" y1="30" x2="250" y2="80" />
    </g>

    <!-- Pulse -->
    <circle cx="120" cy="100" r="20" fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="20;70;70" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0;0" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title -->
  <text x="480" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#FAFAF8" letter-spacing="-1.5">
    Knowledge Engine
  </text>

  <!-- Subtitle -->
  <text x="482" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#78716C" letter-spacing="0.5">
    Turn saved content into compounding technical leverage
  </text>

  <!-- Animated underline -->
  <rect x="480" y="225" width="0" height="3" rx="1.5" fill="url(#teal)">
    <animate attributeName="width" values="0;440;440" dur="1.5s" fill="freeze" />
  </rect>

  <!-- Platform badges -->
  <g transform="translate(480, 260)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="36" height="24" rx="4" fill="#E1306C" />
    <text x="18" y="16" fill="#fff" text-anchor="middle">IG</text>

    <rect x="46" y="0" width="36" height="24" rx="4" fill="#FF0000" />
    <text x="64" y="16" fill="#fff" text-anchor="middle">YT</text>

    <rect x="92" y="0" width="36" height="24" rx="4" fill="#333" />
    <text x="110" y="16" fill="#fff" text-anchor="middle">GH</text>

    <rect x="138" y="0" width="36" height="24" rx="4" fill="#FF4500" />
    <text x="156" y="16" fill="#fff" text-anchor="middle">RD</text>

    <rect x="184" y="0" width="36" height="24" rx="4" fill="#1DA1F2" />
    <text x="202" y="16" fill="#fff" text-anchor="middle">X</text>

    <rect x="230" y="0" width="36" height="24" rx="4" fill="#FF6600" />
    <text x="248" y="16" fill="#fff" text-anchor="middle">HN</text>

    <rect x="276" y="0" width="36" height="24" rx="4" fill="#B31B1B" />
    <text x="294" y="16" fill="#fff" text-anchor="middle">AX</text>

    <rect x="322" y="0" width="36" height="24" rx="4" fill="#00f2ea" />
    <text x="340" y="16" fill="#1C1917" text-anchor="middle">TT</text>
  </g>

  <!-- Version badge -->
  <g transform="translate(480, 310)">
    <rect x="0" y="0" width="65" height="22" rx="4" fill="#0D9488" opacity="0.15" />
    <text x="32" y="15" font-family="monospace" font-size="11" fill="#14B8A6" text-anchor="middle">v0.1.0</text>

    <rect x="75" y="0" width="80" height="22" rx="4" fill="#0D9488" opacity="0.15" />
    <text x="115" y="15" font-family="monospace" font-size="11" fill="#14B8A6" text-anchor="middle">local-first</text>

    <rect x="165" y="0" width="90" height="22" rx="4" fill="#0D9488" opacity="0.15" />
    <text x="210" y="15" font-family="monospace" font-size="11" fill="#14B8A6" text-anchor="middle">148 tests</text>
  </g>
</svg>
