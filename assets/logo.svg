<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Brain/Network Icon -->
  <g transform="translate(40, 30)">
    <!-- Central node -->
    <circle cx="70" cy="70" r="12" fill="url(#grad1)">
      <animate attributeName="r" values="12;14;12" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting nodes -->
    <circle cx="20" cy="30" r="7" fill="#0D9488" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="25" r="6" fill="#14B8A6" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="130" cy="90" r="8" fill="#0D9488" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="15" cy="110" r="5" fill="#14B8A6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="90" cy="130" r="7" fill="#0D9488" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="40" cy="135" r="4" fill="#14B8A6" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Connection lines -->
    <line x1="70" y1="70" x2="20" y2="30" stroke="#0D9488" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite" />
    </line>
    <line x1="70" y1="70" x2="120" y2="25" stroke="#14B8A6" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.2s" repeatCount="indefinite" />
    </line>
    <line x1="70" y1="70" x2="130" y2="90" stroke="#0D9488" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.8s" repeatCount="indefinite" />
    </line>
    <line x1="70" y1="70" x2="15" y2="110" stroke="#14B8A6" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="70" y1="70" x2="90" y2="130" stroke="#0D9488" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.2s" repeatCount="indefinite" />
    </line>
    <line x1="70" y1="70" x2="40" y2="135" stroke="#14B8A6" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite" />
    </line>

    <!-- Cross connections -->
    <line x1="20" y1="30" x2="120" y2="25" stroke="#0D9488" stroke-width="1" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="130" y1="90" x2="90" y2="130" stroke="#14B8A6" stroke-width="1" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="15" y1="110" x2="40" y2="135" stroke="#0D9488" stroke-width="1" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="2.8s" repeatCount="indefinite" />
    </line>

    <!-- Pulse ring -->
    <circle cx="70" cy="70" r="20" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0">
      <animate attributeName="r" values="14;50;50" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0;0" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title Text -->
  <text x="210" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#1C1917" letter-spacing="-1">
    Knowledge Engine
  </text>

  <!-- Subtitle -->
  <text x="212" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#78716C" letter-spacing="0.5">
    Turn saved content into compounding technical leverage
  </text>

  <!-- Animated underline -->
  <rect x="210" y="140" width="0" height="3" rx="1.5" fill="url(#grad2)">
    <animate attributeName="width" values="0;380;380" dur="1.5s" fill="freeze" />
  </rect>
</svg>
